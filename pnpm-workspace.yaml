catalog:
  '@gtbuchanan/cli': 2.1.0
  '@gtbuchanan/eslint-config': 0.6.1
  '@gtbuchanan/tsconfig': 0.2.0
  '@gtbuchanan/vitest-config': 0.4.0
  '@types/node': 26.6.6
  '@types/yauzl': 3.4.0
  eslint: 10.14.0
  jiti: 2.7.0
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.1.0
  yauzl: 3.4.0

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 4320 minutes = 3 days, matching the shared Renovate preset's quarantine.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

packages:
  - packages/*

strictPeerDependencies: true
