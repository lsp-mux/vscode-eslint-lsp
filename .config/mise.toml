# The oldest mise that writes and re-resolves the packslip-backed hk entry in
# mise.lock, and that honors minimum_release_age_excludes (below) instead of
# silently ignoring it.
min_version = "2026.9.5"

[env]
# hk wraps hook steps in `mise x` so mise-managed tools resolve without
# activation.
HK_MISE = "1"

[hooks]
# Installs hk's git hooks (pre-commit) on `mise install`.
postinstall = "hk install --mise"

[settings]
# Required for the [hooks] table.
experimental = true
# Records each tool's download URLs and checksums in mise.lock, which the
# shared mise-setup action keys its cache on and installs against.
lockfile = true
# Matches the Renovate 3-day quarantine on fuzzy/`latest` resolution; the
# exact pins below install immediately.
minimum_release_age = "3d"
# Self-published packages never need the supply-chain quarantine, so exclude
# them and fuzzy/`latest` resolution picks up just-cut releases.
minimum_release_age_excludes = ["npm:@gtbuchanan/*"]

# The tasks `gtb sync` generates beside a root mise.toml; its released versions
# don't generate them for .config/. The shared pre-commit workflow runs hk:base.
[tasks."hk:all"]
description = "Run hk across all files (fixes locally, checks in CI)"
run = "pnpm exec gtb hk all"

[tasks."hk:base"]
description = "Run hk on files changed from a base ref (fixes locally, checks in CI)"
run = "pnpm exec gtb hk base"

[tools]
hk = "2.12.0"
jactionlint = "v2.5.0"
node = "26.13.1"
# Supplies renovate-config-validator for the preset's renovate-config step.
# Exempts transitive `@yarnpkg/libzip@3.2.2` from aube's no-downgrade trust
# policy: it is a benign manual publish missing the provenance attestation its
# CI-built predecessor had. Pinned to the exact version, so the exemption
# lapses once a different release resolves.
"npm:renovate" = { trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
], version = "44.224.1" }
pnpm = "12.18.0"
# jactionlint lints workflow `run:` scripts with it.
shellcheck = "0.11.0"
