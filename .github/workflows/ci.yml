name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - run: pnpm run build

      - uses: gtbuchanan/tooling/.github/actions/upload-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: |
            dist/packages/*.tgz
            dist/version.txt

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/download-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: dist

      - run: pnpm run publish

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/download-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: dist

      - run: pnpm run release
        env:
          GH_TOKEN: ${{ github.token }}
