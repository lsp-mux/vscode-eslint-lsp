---
# A newer push to a pull request supersedes its older runs. On main, runs queue
# instead: cancelling one partway through publishing would leave npm and the
# GitHub release out of step.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - uses: gtbuchanan/tooling/.github/actions/upload-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: |
            dist/packages/*.tgz
            dist/version.txt
    timeout-minutes: 30

  publish:
    environment: npm
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Publish
    needs: build
    permissions:
      contents: read
      id-token: write # npm trusted publishing exchanges the OIDC token
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/download-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: dist

      - run: pnpm run publish
    timeout-minutes: 10

  release:
    environment: github
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Release
    needs: build
    permissions:
      contents: write # creates the GitHub release and its tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

      - uses: gtbuchanan/tooling/.github/actions/download-artifact@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
        with:
          name: dist
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run release
    timeout-minutes: 10
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
