---
# Called workflows see the caller's github.workflow, so the `-caller` part keeps
# this group distinct from any they build.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number }}

jobs:
  ci:
    name: CI
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: gtbuchanan/tooling/.github/workflows/ci.yml@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write # Dependency Review posts a PR comment
    uses: gtbuchanan/tooling/.github/workflows/dependency-review.yml@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0

  pre-commit:
    name: Pre-Commit
    # The eslint step shells out to `pnpm exec`, so it needs node_modules.
    uses: gtbuchanan/tooling/.github/workflows/pre-commit.yml@0f6d2cedc85218b1e98c0b796576a64d10373883 # v1.1.0
    with:
      use-pnpm: true
name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
